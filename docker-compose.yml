services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    command: uvicorn backend.slow_backend:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  gateway:
    build: .
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8080
    environment:
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_BACKEND_URL: http://backend:9000
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - backend
